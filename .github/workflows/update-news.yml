name: Actualizar noticias

on:
  schedule:
    - cron: '17 */3 * * *'   # cada 3 horas
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  actions: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Leer feeds y generar data/news.json
        run: node scripts/update-news.mjs

      - name: Commit solo si news.json cambió
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Sin cambios, no hay commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "Actualizar noticias [skip ci]"
            git push
          fi

      - name: Keepalive (evita la desactivación a los 60 días)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-news.yml/enable"
